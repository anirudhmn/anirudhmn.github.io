<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#171c1a">
        <meta name="description" content="A quiet, living rice-flour kolam, drawn around dots and discovered by ants.">
        <script>
            if (location.pathname.endsWith('/kolam/')) {
                location.replace(`${location.pathname}index.html${location.search}${location.hash}`);
            }
        </script>
        <title>Kolam</title>
        <link rel="stylesheet" href="src/style.css?v=20261121-nose-shadow">
    </head>
    <body>
        <main>
            <canvas aria-label="A rice-flour kolam drawing itself around a field of dots, then explored by ants." role="img"></canvas>
        </main>
        <details id="menu">
            <summary aria-label="Menu"><span aria-hidden="true" class="menu-mark">☰</span></summary>
            <div class="controls">
                <button id="today" type="button">Today’s kolam</button>
                <button id="random" type="button">Another pattern</button>
                <form id="seed-form">
                    <label for="seed-input">Choose a seed</label>
                    <div class="seed-entry">
                        <input id="seed-input" name="seed" type="text" maxlength="200" autocomplete="off" placeholder="Type anything">
                        <button class="grow" type="submit" aria-label="Draw this seed">↗</button>
                    </div>
                </form>
                <p id="notice" role="status" aria-live="polite"></p>
            </div>
        </details>
        <script type="module" src="src/main.js?v=20261121-portrait-features"></script>
    </body>
</html>
